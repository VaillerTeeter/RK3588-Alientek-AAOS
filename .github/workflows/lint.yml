---
name: Lint

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 上游目录排除宏（在各 job 的 find 命令中统一引用）
# 不 lint 范围：Android-13/rk-kernel-5.10  Android-13/u-boot
#               Android-13/rkbin           Android-13/prebuilts

jobs:
  # ============================================================
  # Markdown
  # ============================================================
  markdown-lint:
    name: Markdown Lint (markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: ".lintrc/docs/markdown/.markdownlint.json"

  # ============================================================
  # YAML
  # ============================================================
  yaml-lint:
    name: YAML Lint (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs yamllint --config-file .lintrc/general/.yamllint.yml

      - name: Run yamllint (strict mode for data-format YAML files)
        run: |
          # 对项目自有的 YAML 数据配置文件进行二次更严格检查（80 char 行宽等）
          find . \( -name "*.yml" -o -name "*.yaml" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            ! -path "./.lintrc/*" \
            | xargs --no-run-if-empty \
              yamllint --config-file .lintrc/data-formats/.yamllint.yml

  # ============================================================
  # TOML
  # ============================================================
  toml-lint:
    name: TOML Lint (taplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        run: |
          TAPLO_VER="0.9.3"
          curl -fsSL \
            "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VER}/taplo-linux-x86_64.gz" \
            | gzip -d > /usr/local/bin/taplo \
            && chmod +x /usr/local/bin/taplo

      - name: Run taplo format check
        run: |
          find . -name "*.toml" \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              taplo fmt --check \
                --config .lintrc/data-formats/toml/taplo.toml

  # ============================================================
  # Protobuf
  # ============================================================
  protobuf-lint:
    name: Protobuf Lint (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        run: |
          BUF_VER="1.47.2"
          curl -fsSL \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VER}/buf-Linux-x86_64" \
            -o /usr/local/bin/buf \
            && chmod +x /usr/local/bin/buf

      - name: Lint Protobuf files
        run: |
          find . -name "*.proto" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | head -1 | grep . \
            || { echo "No custom .proto files found, skipping."; exit 0; }
          buf lint --config .lintrc/data-formats/protobuf/buf.yaml

      - name: Check Protobuf breaking changes
        if: github.event_name == 'pull_request'
        run: |
          find . -name "*.proto" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | head -1 | grep . \
            || { echo "No custom .proto files found, skipping."; exit 0; }
          buf breaking \
            --config .lintrc/data-formats/protobuf/buf.yaml \
            --against ".git#branch=${{ github.event.pull_request.base.ref }}"

  # ============================================================
  # C / C++ （项目自有代码，排除上游内核 / U-Boot）
  # ============================================================
  c-cpp-lint:
    name: C/C++ Lint (clang-format + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-format-18 clang-tidy-18

      - name: clang-format check
        run: |
          find . \( -name "*.c" -o -name "*.h" \
                 -o -name "*.cpp" -o -name "*.cc" -o -name "*.hpp" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              clang-format-18 \
                --style="file:.lintrc/backend/c-cpp/.clang-format" \
                --dry-run \
                --Werror

      - name: clang-tidy check
        run: |
          find . \( -name "*.c" -o -name "*.cpp" -o -name "*.cc" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              clang-tidy-18 \
                --config-file=.lintrc/backend/c-cpp/.clang-tidy \
                --warnings-as-errors="*"

      - name: clang-tidy C++ check (.clang-tidy-cpp)
        run: |
          find . \( -name "*.cpp" -o -name "*.cc" -o -name "*.hpp" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              clang-tidy-18 \
                --config-file=.lintrc/backend/c-cpp/.clang-tidy-cpp \
                --warnings-as-errors="*"

  # ============================================================
  # Python
  # ============================================================
  python-lint:
    name: Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff==0.9.1 mypy==1.14.1

      - name: Ruff lint check
        run: |
          find . -name "*.py" \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              ruff check --config .lintrc/backend/python/ruff.toml

      - name: Ruff format check
        run: |
          find . -name "*.py" \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              ruff format --check --config .lintrc/backend/python/ruff.toml

      - name: mypy type check
        run: |
          find . -name "*.py" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              mypy --config-file .lintrc/backend/python/mypy.ini

  # ============================================================
  # Shell (Bash)
  # ============================================================
  shell-lint:
    name: Shell Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "--rcfile .lintrc/infrastructure/shell/.shellcheckrc"
        with:
          severity: style
          scandir: "."
          ignore_paths: >
            Android-13/rk-kernel-5.10
            Android-13/u-boot
            Android-13/rkbin
            Android-13/prebuilts

  # ============================================================
  # Go
  # ============================================================
  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: >
            --config .lintrc/backend/go/.golangci.yml
            --timeout 10m
            --path-prefix .
          skip-pkg-cache: false
          skip-build-cache: false

  # ============================================================
  # Rust
  # ============================================================
  rust-lint:
    name: Rust Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check for Rust source files
        id: check-rust
        run: |
          count=$(find . -name "*.rs" ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Rust format check
        if: steps.check-rust.outputs.count != '0'
        run: |
          cp .lintrc/backend/rust/rustfmt.toml .
          cargo fmt --all -- --check

      - name: Clippy
        if: steps.check-rust.outputs.count != '0'
        run: |
          cp .lintrc/backend/rust/.clippy.toml .
          cargo clippy --all-targets -- -D warnings

  # ============================================================
  # Java (Android AAOS 组件)
  # ============================================================
  java-lint:
    name: Java Lint (Checkstyle + PMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Checkstyle
        run: |
          CS_VER="10.21.4"
          curl -fsSL \
            "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CS_VER}/checkstyle-${CS_VER}-all.jar" \
            -o /usr/local/lib/checkstyle.jar

      - name: Install PMD
        run: |
          PMD_VER="7.8.0"
          curl -fsSL \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VER}/pmd-dist-${PMD_VER}-bin.zip" \
            -o /tmp/pmd.zip \
            && unzip -q /tmp/pmd.zip -d /opt \
            && ln -sf "/opt/pmd-bin-${PMD_VER}/bin/pmd" /usr/local/bin/pmd

      - name: Checkstyle
        run: |
          files=$(find . -name "*.java" \
            ! -path "./.git/*" ! -path "./Android-13/*")
          [ -z "$files" ] && { echo "No Java files, skipping."; exit 0; }
          echo "$files" | xargs java -jar /usr/local/lib/checkstyle.jar \
            -c .lintrc/backend/java/checkstyle.xml -f xml

      - name: PMD
        run: |
          files=$(find . -name "*.java" \
            ! -path "./.git/*" ! -path "./Android-13/*")
          [ -z "$files" ] && { echo "No Java files, skipping."; exit 0; }
          echo "$files" | xargs pmd check \
            --rulesets .lintrc/backend/java/pmd-ruleset.xml \
            --format textcolor \
            --fail-on-violation \
            --minimum-priority 5

      - name: Install SpotBugs
        run: |
          SB_VER="4.8.6"
          curl -fsSL \
            "https://github.com/spotbugs/spotbugs/releases/download/${SB_VER}/spotbugs-${SB_VER}.zip" \
            -o /tmp/spotbugs.zip \
            && unzip -q /tmp/spotbugs.zip -d /opt \
            && ln -sf "/opt/spotbugs-${SB_VER}/bin/spotbugs" /usr/local/bin/spotbugs

      - name: SpotBugs
        run: |
          class_files=$(find . -name "*.class" \
            ! -path "./.git/*" ! -path "./Android-13/*" | head -1)
          [ -z "$class_files" ] && {
            echo "No .class files — SpotBugs requires compiled bytecode. Skipping."
            exit 0
          }
          spotbugs \
            -textui \
            -effort:max \
            -high \
            -exclude .lintrc/backend/java/spotbugs-exclude.xml \
            $(find . -name "*.class" ! -path "./.git/*" ! -path "./Android-13/*")

  # ============================================================
  # Kotlin (Android AAOS 组件)
  # ============================================================
  kotlin-lint:
    name: Kotlin Lint (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install detekt
        run: |
          DETEKT_VER="1.23.7"
          curl -fsSL \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VER}/detekt-cli-${DETEKT_VER}-all.jar" \
            -o /usr/local/lib/detekt.jar

      - name: Run detekt
        run: |
          count=$(find . -name "*.kt" ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No Kotlin files, skipping."; exit 0; }
          java -jar /usr/local/lib/detekt.jar \
            --config .lintrc/backend/kotlin/detekt.yml \
            --input . \
            --excludes "**/Android-13/**" \
            --build-upon-default-config \
            --all-rules

      - name: Install ktlint
        run: |
          KTLINT_VER="1.5.0"
          curl -fsSL \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VER}/ktlint" \
            -o /usr/local/bin/ktlint \
            && chmod +x /usr/local/bin/ktlint

      - name: ktlint (editorconfig-kotlin)
        run: |
          count=$(find . -name "*.kt" ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No Kotlin files, skipping."; exit 0; }
          find . -name "*.kt" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              ktlint --editorconfig=".lintrc/backend/kotlin/.editorconfig-kotlin"

  # ============================================================
  # Perl (内核辅助脚本)
  # ============================================================
  perl-lint:
    name: Perl Lint (perlcritic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install perlcritic
        run: sudo apt-get install -y --no-install-recommends libperl-critic-perl

      - name: Run perlcritic
        run: |
          find . -name "*.pl" \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              perlcritic \
                --profile .lintrc/backend/perl/.perlcriticrc \
                --verbose 11

  # ============================================================
  # CMake
  # ============================================================
  cmake-lint:
    name: CMake Lint (cmake-format + cmake-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake-format / cmake-lint
        run: pip install cmakelang==0.6.13

      - name: cmake-format check
        run: |
          find . \( -name "*.cmake" -o -name "CMakeLists.txt" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              cmake-format \
                --config-files .lintrc/infrastructure/build-systems/.cmake-format.yml \
                --check

      - name: cmake-lint
        run: |
          find . \( -name "*.cmake" -o -name "CMakeLists.txt" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              cmake-lint \
                --config-files .lintrc/infrastructure/build-systems/.cmake-format.yml

  # ============================================================
  # Makefile / Android.mk (checkmake)
  # ============================================================
  makefile-lint:
    name: Makefile Lint (checkmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install checkmake
        run: go install github.com/mrtazz/checkmake/cmd/checkmake@latest

      - name: Run checkmake
        run: |
          find . \( -name "*.mk" -o -name "Makefile" -o -name "Kbuild" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | xargs --no-run-if-empty \
              checkmake \
                --config .lintrc/infrastructure/build-systems/.checkmake.ini

  # ============================================================
  # Buildifier (Bazel / GN / BUILD 文件)
  # ============================================================
  buildifier-lint:
    name: Buildifier Lint (Bazel/GN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buildifier
        run: |
          BUILDIFIER_VER="7.3.1"
          curl -fsSL \
            "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VER}/buildifier-linux-amd64" \
            -o /usr/local/bin/buildifier \
            && chmod +x /usr/local/bin/buildifier

      - name: Run buildifier
        run: |
          find . \( -name "*.bazel" -o -name "*.bzl" \
                 -o -name "BUILD" -o -name "WORKSPACE" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              buildifier \
                --config=.lintrc/infrastructure/build-systems/.buildifier.json \
                --mode=check \
                --lint=warn

  # ============================================================
  # Device Tree (dtc + dt-validate)
  # ============================================================
  dt-validate:
    name: Device Tree Validate (dtc + dt-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends device-tree-compiler
          pip install dtschema

      - name: dtc syntax check
        run: |
          find . \( -name "*.dts" -o -name "*.dtsi" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/rk-kernel-5.10/*" \
            ! -path "./Android-13/u-boot/*" \
            ! -path "./Android-13/rkbin/*" \
            ! -path "./Android-13/prebuilts/*" \
            | while read -r f; do
                dtc -I dts -O dtb -Werror -@ -o /dev/null "$f" \
                  && echo "OK: $f" \
                  || { echo "FAIL: $f"; exit 1; }
              done

      - name: Device tree policy check (dt-validate.yaml)
        run: |
          pip install PyYAML --quiet
          python3 - <<'PYEOF'
          import yaml, sys, glob, re
          with open(".lintrc/embedded/device-tree/dt-validate.yaml") as f:
              cfg = yaml.safe_load(f)
          suppress = cfg.get("dtc", {}).get("suppress_warnings", [])
          if suppress:
              print(f"FAIL: suppress_warnings must be empty, got: {suppress}", file=sys.stderr)
              sys.exit(1)
          max_gpio_bank = cfg.get("rk3588", {}).get("max_gpio_bank", 4)
          failed = 0
          dts_files = (
              glob.glob("**/*.dts", recursive=True) +
              glob.glob("**/*.dtsi", recursive=True)
          )
          for f in dts_files:
              if any(ex in f for ex in ["Android-13/", ".git/"]):
                  continue
              try:
                  content = open(f).read()
                  for m in re.finditer(r'\bgpio(\d+)\b', content, re.IGNORECASE):
                      bank = int(m.group(1))
                      if bank >= max_gpio_bank:
                          print(f"FAIL: {f}: GPIO bank {bank} >= max {max_gpio_bank}", file=sys.stderr)
                          failed += 1
              except Exception as e:
                  print(f"ERROR: {f}: {e}", file=sys.stderr)
                  failed += 1
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # SELinux (selint)
  # ============================================================
  selinux-lint:
    name: SELinux Lint (selint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install selint
        run: |
          SELINT_VER="1.4.3"
          curl -fsSL \
            "https://github.com/SELinuxProject/selint/releases/download/v${SELINT_VER}/selint-${SELINT_VER}-x86_64-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin selint \
            && chmod +x /usr/local/bin/selint

      - name: Run selint
        run: |
          count=$(find . -name "*.te" ! -path "./.git/*" \
            ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No .te files found, skipping."; exit 0; }
          selint \
            --config .lintrc/embedded/selinux/selint.conf \
            --source \
            --recursive \
            --summary \
            .

  # ============================================================
  # Kconfig (kconfiglib)
  # ============================================================
  kconfig-lint:
    name: Kconfig Lint (kconfiglib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kconfiglib
        run: pip install kconfiglib==14.1.0

      - name: Validate Kconfig syntax
        run: |
          count=$(find . -name "Kconfig" ! -path "./.git/*" \
            ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No custom Kconfig files, skipping."; exit 0; }
          python3 - <<'EOF'
          import kconfiglib, sys, glob
          failed = 0
          for f in glob.glob("**/Kconfig", recursive=True):
              if any(ex in f for ex in ["Android-13/", ".git/"]):
                  continue
              try:
                  kconfiglib.Kconfig(f)
                  print(f"OK: {f}")
              except Exception as e:
                  print(f"FAIL: {f}: {e}", file=sys.stderr)
                  failed += 1
          sys.exit(1 if failed else 0)
          EOF

      - name: Validate defconfigs against kconfiglint policy
        run: |
          pip install PyYAML --quiet
          count=$(find . -name "*defconfig" ! -path "./.git/*" \
            ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No defconfig files, skipping."; exit 0; }
          python3 - <<'PYEOF'
          import yaml, sys, glob
          with open(".lintrc/embedded/kconfig/kconfiglint.yaml") as f:
              cfg = yaml.safe_load(f)
          defcfg    = cfg.get("defconfig", {})
          forbidden = defcfg.get("forbidden_in_production", [])
          required  = defcfg.get("required_in_production", [])
          failed = 0
          for defconfig in glob.glob("**/*defconfig", recursive=True):
              if any(ex in defconfig for ex in ["Android-13/", ".git/"]):
                  continue
              lines = open(defconfig).read().splitlines()
              enabled = set()
              for line in lines:
                  if "=" in line and not line.startswith("#"):
                      sym, val = line.split("=", 1)
                      if val.strip() not in ("n", ""):
                          enabled.add(sym.strip())
              for sym in forbidden:
                  key = sym if sym.startswith("CONFIG_") else f"CONFIG_{sym}"
                  if key in enabled:
                      print(f"FAIL: {defconfig}: forbidden {key} is enabled", file=sys.stderr)
                      failed += 1
              for sym in required:
                  key = sym if sym.startswith("CONFIG_") else f"CONFIG_{sym}"
                  if key not in enabled:
                      print(f"FAIL: {defconfig}: required {key} is not enabled", file=sys.stderr)
                      failed += 1
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # Secret scanning
  # ============================================================
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .lintrc/security/.gitleaks.toml

  # ============================================================
  # Semgrep security scan
  # ============================================================
  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep \
            --config .lintrc/security/.semgrep.yml \
            --config p/owasp-top-ten \
            --config p/c \
            --config p/java \
            --config p/python \
            --config p/security-audit \
            --config p/android \
            --error \
            --no-rewrite-rule-ids \
            --exclude "Android-13/rk-kernel-5.10" \
            --exclude "Android-13/u-boot" \
            --exclude "Android-13/rkbin" \
            --exclude "Android-13/prebuilts" \
            .

  # ============================================================
  # Commit message
  # ============================================================
  commitlint-lint:
    name: Commitlint (Commit Message)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install commitlint
        run: |
          npm install --no-package-lock \
            @commitlint/cli@19.6.0 \
            @commitlint/config-conventional@19.6.0 \
            conventional-changelog-conventionalcommits@8.0.0

      - name: Lint commits
        run: |
          npx commitlint \
            --config .lintrc/git/.commitlintrc.cjs \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ============================================================
  # Spelling
  # ============================================================
  cspell-lint:
    name: CSpell (Spelling Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install cspell
        run: npm install -g cspell@8.17.1

      - name: Run cspell
        run: |
          cspell lint \
            --config .lintrc/general/cspell.json \
            --no-progress \
            --no-summary \
            --gitignore \
            --exclude ".lintrc/**" \
            --exclude "Android-13/rk-kernel-5.10/**" \
            --exclude "Android-13/u-boot/**" \
            --exclude "Android-13/rkbin/**" \
            --exclude "Android-13/prebuilts/**" \
            "**"

  # ============================================================
  # File naming
  # ============================================================
  ls-lint:
    name: ls-lint (File Naming)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ls-lint
        run: |
          LS_LINT_VER="2.3.1"
          curl -sL \
            "https://github.com/loeffel-io/ls-lint/releases/download/v${LS_LINT_VER}/ls-lint-linux-amd64" \
            -o /usr/local/bin/ls-lint \
            && chmod +x /usr/local/bin/ls-lint

      - name: Run ls-lint
        run: ls-lint --config .lintrc/general/.ls-lint.yml

  # ============================================================
  # Groovy / Gradle (CodeNarc)
  # ============================================================
  groovy-lint:
    name: Groovy/Gradle Lint (CodeNarc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install npm-groovy-lint
        run: npm install -g npm-groovy-lint@14.6.0

      - name: Run Groovy/Gradle lint
        run: |
          count=$(find . \( -name "*.groovy" -o -name "*.gradle" \) \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No Groovy/Gradle files, skipping."; exit 0; }
          npm-groovy-lint \
            --path . \
            --files "**/*.groovy,**/*.gradle" \
            --ignore "**/Android-13/**,.git/**" \
            --ruleset .lintrc/backend/groovy/codenarc.xml \
            --failon warning \
            --no-insight

  # ============================================================
  # RST (ReStructuredText)
  # ============================================================
  rst-lint:
    name: RST Lint (rstcheck + doc8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rstcheck and doc8
        run: pip install "rstcheck[sphinx]==6.2.4" doc8==1.1.2

      - name: Run rstcheck
        run: |
          find . -name "*.rst" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              rstcheck --config .lintrc/docs/rst/rstcheck.cfg

      - name: Run doc8
        run: |
          find . -name "*.rst" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              doc8 --config .lintrc/docs/rst/doc8.ini

  # ============================================================
  # JSON (Biome)
  # ============================================================
  json-lint:
    name: JSON Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Biome
        run: |
          BIOME_VER="1.9.4"
          curl -fsSL \
            "https://github.com/biomejs/biome/releases/download/cli%2Fv${BIOME_VER}/biome-linux-x64" \
            -o /usr/local/bin/biome \
            && chmod +x /usr/local/bin/biome

      - name: Run Biome JSON lint
        run: |
          count=$(find . -name "*.json" \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No JSON files, skipping."; exit 0; }
          find . -name "*.json" \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              biome ci \
                --config-path .lintrc/data-formats/json \
                --no-errors-on-unmatched

      - name: Install ESLint JSONC
        run: npm install -g eslint@8 eslint-plugin-jsonc@2

      - name: ESLint JSONC lint (.eslintrc-jsonc.json)
        run: |
          count=$(find . \( -name "*.json" -o -name "*.jsonc" \) \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No JSON/JSONC files, skipping."; exit 0; }
          find . \( -name "*.json" -o -name "*.jsonc" \) \
            ! -path "./.git/*" \
            ! -path "./Android-13/*" \
            | xargs --no-run-if-empty \
              eslint \
                --no-eslintrc \
                --config .lintrc/data-formats/json/.eslintrc-jsonc.json \
                --max-warnings 0

      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.31.3

      - name: JSON Schema validation (jsonschema-validators.yaml)
        run: |
          pip install PyYAML --quiet
          python3 - <<'PYEOF'
          import yaml, sys, subprocess, glob, os
          with open(".lintrc/data-formats/json/jsonschema-validators.yaml") as f:
              cfg = yaml.safe_load(f)
          schemas = cfg.get("schemas", [])
          failed = 0
          for schema in schemas:
              patterns = schema.get("fileMatch", [])
              schema_url = schema.get("url", "")
              schema_name = schema.get("name", schema_url)
              for pattern in patterns:
                  files = [
                      f for f in glob.glob(f"**/{pattern}", recursive=True)
                      if "Android-13/" not in f and ".git/" not in f
                  ]
                  for file in files:
                      result = subprocess.run(
                          ["check-jsonschema", "--schemafile", schema_url, file],
                          capture_output=True, text=True
                      )
                      if result.returncode != 0:
                          print(f"FAIL: {file} against schema '{schema_name}':", file=sys.stderr)
                          print(result.stdout + result.stderr, file=sys.stderr)
                          failed += 1
                      else:
                          print(f"OK: {file} ({schema_name})")
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # Android.bp (policy check)
  # ============================================================
  android-bp-lint:
    name: Android.bp Lint (policy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Check Android.bp policy
        run: |
          count=$(find . -name "*.bp" \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No Android.bp files, skipping."; exit 0; }
          python3 - <<'PYEOF'
          import yaml, sys, glob
          with open(".lintrc/embedded/android-bp/bpfmt.yaml") as f:
              cfg = yaml.safe_load(f)
          policy = cfg.get("policy", {})
          forbidden_flags = []
          flag_key = policy.get("forbidden_warning_suppression_flag")
          if flag_key:
              forbidden_flags.append(flag_key)
          if policy.get("forbid_fpermissive"):
              forbidden_flags.append("-fpermissive")
          if policy.get("forbid_wno_error"):
              forbidden_flags.append("-Wno-error")
          if policy.get("forbid_no_optimization_in_production"):
              forbidden_flags.append("-O0")
          failed = 0
          for bp_file in glob.glob("**/*.bp", recursive=True):
              if any(ex in bp_file for ex in ["Android-13/", ".git/"]):
                  continue
              try:
                  content = open(bp_file).read()
                  for flag in forbidden_flags:
                      if f'"{flag}"' in content:
                          print(f"FAIL: {bp_file}: forbidden cflag '{flag}'", file=sys.stderr)
                          failed += 1
              except Exception as e:
                  print(f"ERROR: {bp_file}: {e}", file=sys.stderr)
                  failed += 1
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # Android init .rc files
  # ============================================================
  android-rc-lint:
    name: Android Init RC Lint (policy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Check Android .rc policy
        run: |
          count=$(find . -name "*.rc" \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No .rc files, skipping."; exit 0; }
          python3 - <<'PYEOF'
          import yaml, sys, glob, re
          with open(".lintrc/embedded/android-rc/android-rc-checks.yaml") as f:
              cfg = yaml.safe_load(f)
          forbidden_users   = set(cfg.get("service",      {}).get("forbidden_users",        []))
          forbidden_caps    = set(cfg.get("capabilities", {}).get("forbidden_capabilities",  []))
          forbidden_setprop = set(cfg.get("properties",   {}).get("forbidden_setprop",       []))
          forbid_chmod_777  =     cfg.get("filesystem",   {}).get("forbid_chmod_777",        True)
          forbidden_kw      = set(cfg.get("deprecated",   {}).get("forbidden_keywords",      []))
          failed = 0
          for rc_file in glob.glob("**/*.rc", recursive=True):
              if any(ex in rc_file for ex in ["Android-13/", ".git/"]):
                  continue
              try:
                  for lineno, line in enumerate(open(rc_file), 1):
                      s = line.strip()
                      m = re.match(r'^user\s+(\S+)', s)
                      if m and m.group(1) in forbidden_users:
                          print(f"FAIL: {rc_file}:{lineno}: forbidden user '{m.group(1)}'", file=sys.stderr)
                          failed += 1
                      if s.startswith("capabilities "):
                          for cap in forbidden_caps:
                              if cap in s:
                                  print(f"FAIL: {rc_file}:{lineno}: forbidden capability '{cap}'", file=sys.stderr)
                                  failed += 1
                      if forbid_chmod_777 and re.search(r'chmod\s+0?777', s):
                          print(f"FAIL: {rc_file}:{lineno}: chmod 777 is forbidden", file=sys.stderr)
                          failed += 1
                      m2 = re.match(r'^setprop\s+(\S+)', s)
                      if m2 and m2.group(1) in forbidden_setprop:
                          print(f"FAIL: {rc_file}:{lineno}: forbidden setprop '{m2.group(1)}'", file=sys.stderr)
                          failed += 1
                      first_word = s.split()[0] if s.split() else ""
                      if first_word in forbidden_kw:
                          print(f"FAIL: {rc_file}:{lineno}: deprecated keyword '{first_word}'", file=sys.stderr)
                          failed += 1
              except Exception as e:
                  print(f"ERROR: {rc_file}: {e}", file=sys.stderr)
                  failed += 1
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # AIDL (naming + policy check)
  # ============================================================
  aidl-lint:
    name: AIDL Lint (policy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Check AIDL policy
        run: |
          count=$(find . -name "*.aidl" \
            ! -path "./.git/*" ! -path "./Android-13/*" | wc -l)
          [ "$count" -eq 0 ] && { echo "No AIDL files, skipping."; exit 0; }
          python3 - <<'PYEOF'
          import yaml, sys, glob, re
          with open(".lintrc/embedded/aidl/aidl-lint.yaml") as f:
              cfg = yaml.safe_load(f)
          iface_pattern      = cfg.get("naming", {}).get("interface_pattern", r'^I[A-Z][A-Za-z0-9]+$')
          forbid_raw_ibinder = cfg.get("policy", {}).get("forbid_raw_ibinder", True)
          failed = 0
          for aidl_file in glob.glob("**/*.aidl", recursive=True):
              if any(ex in aidl_file for ex in ["Android-13/", ".git/"]):
                  continue
              try:
                  content = open(aidl_file).read()
                  for m in re.finditer(r'\binterface\s+(\w+)', content):
                      name = m.group(1)
                      if not re.match(iface_pattern, name):
                          print(f"FAIL: {aidl_file}: interface '{name}' violates pattern '{iface_pattern}'", file=sys.stderr)
                          failed += 1
                  if forbid_raw_ibinder and re.search(r'\bIBinder\b', content):
                      print(f"FAIL: {aidl_file}: raw IBinder usage is forbidden", file=sys.stderr)
                      failed += 1
              except Exception as e:
                  print(f"ERROR: {aidl_file}: {e}", file=sys.stderr)
                  failed += 1
          sys.exit(1 if failed else 0)
          PYEOF

  # ============================================================
  # HIDL (forbid new HIDL interfaces — Android 12+ policy)
  # ============================================================
  hidl-lint:
    name: HIDL Lint (forbid new interfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install PyYAML

      - name: Enforce no new HIDL interfaces
        run: |
          python3 - <<'PYEOF'
          import yaml, sys, glob
          with open(".lintrc/embedded/hidl/hidl-lint.yaml") as f:
              cfg = yaml.safe_load(f)
          forbid_new = cfg.get("policy", {}).get("forbid_new_hidl_interfaces", True)
          if not forbid_new:
              print("HIDL new-interface check disabled in config.")
              sys.exit(0)
          hal_files = [
              f for f in glob.glob("**/*.hal", recursive=True)
              if "Android-13/" not in f and ".git/" not in f
          ]
          if hal_files:
              print("FAIL: New HIDL interfaces are forbidden (Android 12+: use AIDL):", file=sys.stderr)
              for f in hal_files:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)
          print("No new HIDL interfaces found. OK.")
          PYEOF

  # ============================================================
  # Summary gate — used as the single required status check
  # ============================================================
  all-checks:
    name: All Lint Checks Passed
    if: always()
    needs:
      - markdown-lint
      - yaml-lint
      - toml-lint
      - protobuf-lint
      - c-cpp-lint
      - python-lint
      - shell-lint
      - go-lint
      - rust-lint
      - java-lint
      - kotlin-lint
      - perl-lint
      - cmake-lint
      - makefile-lint
      - buildifier-lint
      - dt-validate
      - selinux-lint
      - kconfig-lint
      - secret-scan
      - semgrep-scan
      - commitlint-lint
      - cspell-lint
      - ls-lint
      - groovy-lint
      - rst-lint
      - json-lint
      - android-bp-lint
      - android-rc-lint
      - aidl-lint
      - hidl-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed (or were skipped)."
