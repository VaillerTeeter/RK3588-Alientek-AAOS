---
# ls-lint 配置 — 文件命名规范（RK3588-Alientek-AAOS 项目）
# 文档：https://ls-lint.org/2.x/configuration/the-rules.html
# 用法：ls-lint --config .lintrc/general/.ls-lint.yml

ls:
  # ============================================================
  # 默认全局规则（适用于项目自有文件）
  # ============================================================
  .default:
    # C / C++ 源文件 — Linux 内核惯例：snake_case
    .c: snake_case
    .h: snake_case
    .cpp: snake_case
    .hpp: snake_case

    # Shell 脚本
    .sh: snake_case | kebab-case

    # Python 脚本
    .py: snake_case

    # 设备树（Device Tree）— 行业惯例 kebab-case（如 rk3588-evb.dts）
    .dts: kebab-case
    .dtsi: kebab-case

    # Android / Makefile 片段
    .mk: snake_case | kebab-case

    # 数据格式
    .json: kebab-case | snake_case
    .yaml: kebab-case | regex:[A-Z._-]+
    .yml: kebab-case | regex:[A-Z._-]+
    .toml: kebab-case | snake_case

    # 配置文件（含隐藏文件如 .rstcheck.cfg 等，前缀点 + 小写字母开头）
    .cfg: regex:\.?[a-z][a-z0-9._-]*
    .ini: regex:\.?[a-z][a-z0-9._-]*
    .conf: regex:\.?[a-z][a-z0-9._-]*

    # 文档
    .md: SCREAMING_SNAKE_CASE | kebab-case
    .rst: SCREAMING_SNAKE_CASE | kebab-case | snake_case

  # ============================================================
  # .github 目录
  # ============================================================
  .github:
    .yml: kebab-case
    .yaml: kebab-case
    .json: kebab-case
    .md: SCREAMING_SNAKE_CASE | kebab-case

# ============================================================
# 忽略路径（上游代码遵循各自项目的命名约定，不纳入本规范）
# ============================================================
ignore:
  - .git
  - Android/rk-kernel-5.10
  - Android/u-boot
  - Android/rkbin
  - Android/prebuilts
