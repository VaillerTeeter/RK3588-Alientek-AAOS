# Semgrep 安全扫描配置 — RK3588-Alientek-AAOS 项目（全量严格模式）
# 目标语言：C / C++（内核驱动、U-Boot、HAL）、Bash（构建脚本）、
#           Python（工具脚本）、Java（Android AAOS 组件）
# 涵盖：OWASP Top 10 2021 + 嵌入式/Android 专项规则
# 用法：
#   semgrep --config .lintrc/security/.semgrep.yml \
#           --config p/owasp-top-ten \
#           --config p/c \
#           --config p/java \
#           --config p/python \
#           --config p/security-audit \
#           --config p/android

---
rules:
  # ============================================================
  # A02: Cryptographic Failures — 硬编码凭证
  # ============================================================
  - id: c-hardcoded-credentials
    pattern-either:
      - pattern: char *password = "...";
      - pattern: char *passwd = "...";
      - pattern: char *secret = "...";
      - pattern: char *api_key = "...";
      - pattern: 'char password[] = "...";'
      - pattern: '#define PASSWORD "..."'
      - pattern: '#define SECRET_KEY "..."'
    message: "Hardcoded credential in C/C++ code. Use environment config or Android Keystore."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: python-hardcoded-credentials
    pattern-either:
      - pattern: password = "..."
      - pattern: passwd = "..."
      - pattern: secret = "..."
      - pattern: api_key = "..."
      - pattern: access_token = "..."
      - pattern: private_key = "..."
      - pattern: PASSWORD = "..."
      - pattern: SECRET_KEY = "..."
    message: "Hardcoded credential. Use environment variables or a secrets manager."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: java-hardcoded-credentials
    pattern-either:
      - pattern: String password = "...";
      - pattern: String passwd = "...";
      - pattern: String secret = "...";
      - pattern: String apiKey = "...";
      - pattern: String accessToken = "...";
      - pattern: String privateKey = "...";
      - pattern: private static final String PASSWORD = "...";
      - pattern: private static final String SECRET = "...";
    message: "Hardcoded credential in Java code. Use Android Keystore or system properties."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"

  # ============================================================
  # A02: Cryptographic Failures — 弱算法
  # ============================================================
  - id: python-weak-hash
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: "MD5/SHA-1 are cryptographically broken. Use hashlib.sha256() or stronger."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: java-weak-message-digest
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")
    message: "MD5/SHA-1 are cryptographically broken. Use SHA-256 or stronger."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: bash-tls-verification-disabled
    pattern-either:
      - pattern: curl -k $URL
      - pattern: curl --insecure $URL
      - pattern: curl ... -k ...
      - pattern: curl ... --insecure ...
    message: "curl -k/--insecure disables TLS certificate verification. Remove in production."
    languages: [bash]
    severity: ERROR
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: bash-wget-no-check-certificate
    pattern: wget --no-check-certificate $URL
    message: "wget --no-check-certificate disables TLS validation. Remove in production."
    languages: [bash]
    severity: ERROR
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"

  # ============================================================
  # A03: Injection — C/C++ 禁用函数（缓冲区溢出）
  # ============================================================
  - id: c-use-of-gets
    pattern: gets($BUF)
    message: "gets() has no bounds checking and is unconditionally unsafe. Use fgets(buf, sizeof(buf), stdin)."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  - id: c-use-of-strcpy
    pattern: strcpy($DST, $SRC)
    message: "strcpy() has no bounds checking. Use strlcpy() or strncpy() with an explicit size limit."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  - id: c-use-of-strcat
    pattern: strcat($DST, $SRC)
    message: "strcat() has no bounds checking. Use strlcat() or strncat() with an explicit size limit."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  - id: c-use-of-sprintf
    pattern: sprintf($BUF, $FMT, ...)
    message: "sprintf() has no bounds checking. Use snprintf(buf, sizeof(buf), fmt, ...) instead."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  - id: c-use-of-vsprintf
    pattern: vsprintf($BUF, $FMT, $ARGS)
    message: "vsprintf() has no bounds checking. Use vsnprintf(buf, sizeof(buf), fmt, args) instead."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  - id: c-unsafe-scanf-no-width
    pattern-either:
      - pattern: scanf("%s", $BUF)
      - pattern: sscanf($SRC, "%s", $BUF)
      - pattern: fscanf($FP, "%s", $BUF)
    message: "scanf/sscanf/fscanf with bare %s has no width limit. Specify a maximum, e.g., %255s."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A03: Injection — C/C++ 格式字符串漏洞
  # ============================================================
  - id: c-format-string-variable
    pattern-either:
      - pattern: printf($FMT)
      - pattern: fprintf($FD, $FMT)
      - pattern: syslog($PRI, $FMT)
      - pattern: printk($FMT)
    message: "User-controlled format string. Always pass a literal format, e.g., printf(\"%s\", input)."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-134: Use of Externally-Controlled Format String"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A03: Injection — C/C++ 命令注入
  # ============================================================
  - id: c-system-variable-argument
    pattern: system($CMD)
    message: "system() with a non-literal argument enables command injection. Use execve() with a validated argument array."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  - id: c-popen-variable-argument
    pattern: popen($CMD, $MODE)
    message: "popen() with a variable command enables command injection. Validate and sanitize all arguments."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A03: Injection — Python 命令注入
  # ============================================================
  - id: python-subprocess-shell-true
    pattern-either:
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
    message: "subprocess with shell=True and a variable argument enables command injection. Pass a list of arguments instead."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  - id: python-os-system-variable
    pattern: os.system($CMD)
    message: "os.system() with a variable command enables command injection. Use subprocess with an argument list."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A03: Injection — Bash 命令注入
  # ============================================================
  - id: bash-eval-with-variable
    pattern-either:
      - pattern: eval "$VAR"
      - pattern: eval "$@"
      - pattern: eval "$*"
    message: "eval with a variable/external input enables command injection. Avoid eval or validate input strictly."
    languages: [bash]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A03: Injection — Java SQL 注入（Android SQLite）
  # ============================================================
  - id: java-sql-injection-concat
    pattern-either:
      - pattern: $DB.rawQuery($QUERY + $INPUT, ...)
      - pattern: $DB.execSQL($QUERY + $INPUT)
      - pattern: $STMT = "SELECT" + $INPUT
      - pattern: $STMT = "INSERT" + $INPUT
      - pattern: $STMT = "UPDATE" + $INPUT
      - pattern: $STMT = "DELETE" + $INPUT
    message: "SQL injection via string concatenation. Use parameterized queries (selectionArgs[]) instead."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  # ============================================================
  # A04: Insecure Design — C/C++ 整数溢出
  # ============================================================
  - id: c-integer-overflow-in-alloc
    pattern-either:
      - pattern: malloc($A * $B)
      - pattern: kmalloc($A * $B, $FLAGS)
      - pattern: kzalloc($A * $B, $FLAGS)
      - pattern: vmalloc($A * $B)
    message: "Potential integer overflow in allocation size. Validate operands or use struct_size()/array_size() helpers."
    languages: [c, cpp]
    severity: ERROR
    metadata:
      cwe: "CWE-190: Integer Overflow or Wraparound"
      owasp: "A04:2021 - Insecure Design"

  # ============================================================
  # A04: Insecure Design — 路径遍历
  # ============================================================
  - id: python-path-traversal
    pattern-either:
      - pattern: open(os.path.join($BASE, $USER_INPUT))
      - pattern: open($BASE + $USER_INPUT)
      - pattern: open($BASE + "/" + $USER_INPUT)
    message: "Possible path traversal. Canonicalize the path and validate it against an allowlist."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-22: Path Traversal"
      owasp: "A04:2021 - Insecure Design"

  # ============================================================
  # A05: Security Misconfiguration — Android
  # ============================================================
  - id: android-world-readable-file
    pattern-either:
      - pattern: openFileOutput($NAME, Context.MODE_WORLD_READABLE)
      - pattern: openFileOutput($NAME, 1)
    message: "MODE_WORLD_READABLE exposes app files to all other apps. Use MODE_PRIVATE."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: "A05:2021 - Security Misconfiguration"

  - id: android-world-writable-file
    pattern-either:
      - pattern: openFileOutput($NAME, Context.MODE_WORLD_WRITEABLE)
      - pattern: openFileOutput($NAME, 2)
    message: "MODE_WORLD_WRITEABLE allows any app to overwrite this file. Use MODE_PRIVATE."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      owasp: "A05:2021 - Security Misconfiguration"

  # ============================================================
  # A08: Software and Data Integrity Failures — 不安全反序列化
  # ============================================================
  - id: python-pickle-loads-untrusted
    pattern-either:
      - pattern: pickle.loads($DATA)
      - pattern: pickle.load($FILE)
    message: "pickle.loads/load() with untrusted data enables arbitrary code execution. Use JSON or a safe format."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: python-yaml-load-unsafe
    pattern: yaml.load($DATA)
    message: "yaml.load() without an explicit Loader is unsafe. Use yaml.safe_load() instead."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  # ============================================================
  # A09: Security Logging — 凭证泄露到日志
  # ============================================================
  - id: android-log-sensitive-data
    pattern-either:
      - pattern: Log.d($TAG, "... password ...")
      - pattern: Log.d($TAG, "... token ...")
      - pattern: Log.d($TAG, "... secret ...")
      - pattern: Log.i($TAG, "... password ...")
      - pattern: Log.i($TAG, "... token ...")
      - pattern: Log.e($TAG, "... password ...")
      - pattern: Log.v($TAG, "... password ...")
      - pattern: Log.w($TAG, "... password ...")
    message: "Possible credential exposure in Android log. Never log passwords, tokens, or secrets."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"

  - id: python-log-sensitive-data
    pattern-either:
      - pattern: logging.info("... password ...")
      - pattern: logging.debug("... password ...")
      - pattern: logging.warning("... token ...")
      - pattern: print("... password ...")
      - pattern: print("... secret ...")
    message: "Possible credential exposure in Python log/print. Never log passwords, tokens, or secrets."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"

  # ============================================================
  # A01: Broken Access Control — Android WebView
  # ============================================================
  - id: android-webview-javascript-enabled
    pattern: $WEB.getSettings().setJavaScriptEnabled(true)
    message: "JavaScript enabled in WebView. Ensure content is trusted and set a strict WebViewClient."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A01:2021 - Broken Access Control"

  - id: android-webview-file-access
    pattern-either:
      - pattern: $WEB.getSettings().setAllowFileAccess(true)
      - pattern: $WEB.getSettings().setAllowFileAccessFromFileURLs(true)
      - pattern: $WEB.getSettings().setAllowUniversalAccessFromFileURLs(true)
    message: "WebView file access grants web content access to the local filesystem. Disable unless strictly necessary."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "A01:2021 - Broken Access Control"
