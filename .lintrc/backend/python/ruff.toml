# Ruff 配置 — 现代 Python 统一 Linter + Formatter
# 文档：https://docs.astral.sh/ruff/configuration/
# 用法：ruff check --config .lintrc/backend/python/ruff.toml . && ruff format --check --config .lintrc/backend/python/ruff.toml .

# ============================================================
# 基础设置
# ============================================================
target-version = "py311"
line-length = 100
indent-width = 4

# ============================================================
# 文件排除
# ============================================================
exclude = [
  ".git",
  ".github",
  "__pycache__",
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  ".eggs",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  "node_modules",
  "migrations",
]

# ============================================================
# Lint 规则选择
# ============================================================
[lint]
# 启用规则集：
# E/W = pycodestyle
# F   = pyflakes
# I   = isort
# N   = pep8-naming
# UP  = pyupgrade（语法现代化）
# B   = flake8-bugbear
# C4  = flake8-comprehensions
# SIM = flake8-simplify
# ANN = flake8-annotations（类型注解）
# S   = flake8-bandit（安全）
# PT  = flake8-pytest-style
# RET = flake8-return
# RUF = Ruff-specific
# A      = flake8-builtins
# ANN    = flake8-annotations
# ARG    = flake8-unused-arguments
# ASYNC  = flake8-async
# B      = flake8-bugbear
# BLE    = flake8-blind-except
# C4     = flake8-comprehensions
# C90    = mccabe 圈复杂度
# COM    = flake8-commas
# D      = pydocstyle
# DTZ    = flake8-datetimez
# E      = pycodestyle errors
# EM     = flake8-errmsg
# ERA    = eradicate
# EXE    = flake8-executable
# F      = pyflakes
# FA     = flake8-future-annotations
# FBT    = flake8-boolean-trap
# FIX    = flake8-fixme
# FLY    = flynt
# FURB   = refurb
# G      = flake8-logging-format
# I      = isort
# ICN    = flake8-import-conventions
# INP    = flake8-no-pep420
# ISC    = flake8-implicit-str-concat
# LOG    = flake8-logging
# N      = pep8-naming
# PERF   = perflint
# PGH    = pygrep-hooks
# PIE    = flake8-pie
# PL     = pylint
# PT     = flake8-pytest-style
# PTH    = flake8-use-pathlib
# Q      = flake8-quotes
# RET    = flake8-return
# RSE    = flake8-raise
# RUF    = Ruff 特有规则
# S      = flake8-bandit
# SIM    = flake8-simplify
# SLOT   = flake8-slots
# T10    = flake8-debugger
# T20    = flake8-print
# TCH    = flake8-type-checking
# TID    = flake8-tidy-imports
# TRY    = tryceratops
# UP     = pyupgrade
# W      = pycodestyle warnings
# YTT    = flake8-2020
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TCH",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]

# ============================================================
# 规则细节
# ============================================================
[lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.validator"]

[lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"

[lint.isort]
known-first-party = ["src", "app"]
force-single-line = false
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 5
max-branches = 8
max-returns = 2
max-statements = 30

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
strict = true

[lint.flake8-errmsg]
max-string-length = 20

[lint.pydocstyle]
# Google 风格：首行摘要、Args/Returns/Raises 段落
convention = "google"

# ============================================================
# Formatter 设置
# ============================================================
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80
