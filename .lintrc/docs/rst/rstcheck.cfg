# rstcheck — reStructuredText 语法检查配置（全量严格模式）
# 文档：https://rstcheck.readthedocs.io/en/latest/usage/config.html
# 用法：
#   rstcheck --config .lintrc/docs/rst/rstcheck.cfg <file.rst>
#   rstcheck --config .lintrc/docs/rst/rstcheck.cfg --recursive docs/
#
# 检查范围：
#   - RST 结构语法（标题层级、指令格式、角色引用等）
#   - 嵌入代码块语法（Python / C / C++ / Bash / JSON / XML / YAML / RST）
#   - 文档内部链接目标是否存在

[rstcheck]

# ------------------------------------------------------------------
# 报告级别
# ------------------------------------------------------------------
# 1 = INFO    — 显示全部问题（最严格）
# 2 = WARNING — 警告及以上
# 3 = ERROR   — 错误及以上
# 4 = SEVERE  — 仅显示严重错误
#
# 设为 1 确保所有级别的问题都被报告
report_level = 1

# ------------------------------------------------------------------
# 忽略的 RST 指令
# ------------------------------------------------------------------
# 不豁免任何自定义指令 —— 全部必须通过检查
# （若项目引入 Sphinx 扩展指令，请通过 --ignore-directives 临时覆盖，
#  而非在此处永久豁免）
ignore_directives =

# ------------------------------------------------------------------
# 忽略的 RST 角色（roles）
# ------------------------------------------------------------------
# 不豁免任何自定义角色 —— 全部必须通过检查
ignore_roles =

# ------------------------------------------------------------------
# 忽略的替换（substitutions）
# ------------------------------------------------------------------
# 不豁免任何替换定义 —— 全部必须通过检查
ignore_substitutions =

# ------------------------------------------------------------------
# 忽略嵌入代码块中的语言检查
# ------------------------------------------------------------------
# 支持检查的语言：
#   bash, c, cpp, doctest, json, python, rst, xml, yaml
#
# 不豁免任何语言 —— 所有嵌入代码块都必须通过语法检查
ignore_languages =
