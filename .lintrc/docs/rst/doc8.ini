# doc8 — reStructuredText 样式检查配置（全量严格模式）
# 文档：https://doc8.readthedocs.io/en/stable/
# 用法：
#   doc8 --config .lintrc/docs/rst/doc8.ini docs/
#   doc8 --config .lintrc/docs/rst/doc8.ini path/to/file.rst
#
# 强制执行全部规则：
#   D000: RST 格式无效（语法错误）
#   D001: 行长度不超过 max-line-length（79 字符）
#         例外：无空白字符的行 / 含 http/https URL 的行 /
#               字面块 / RST 目标指令
#   D002: 行尾不得有空白字符
#   D003: 缩进禁止使用 Tab，必须使用空格
#   D004: 禁止回车符（CR），换行必须使用 LF
#   D005: 文件末尾必须有换行符

[doc8]

# ------------------------------------------------------------------
# 行长度限制
# ------------------------------------------------------------------
# 79 列 = PEP 8 / reStructuredText 社区标准
max-line-length = 79

# ------------------------------------------------------------------
# 节标题下划线/上划线长度
# ------------------------------------------------------------------
# false（默认）= 不允许超长的节标题装饰线
allow-long-titles = false

# ------------------------------------------------------------------
# 错误码豁免列表
# ------------------------------------------------------------------
# 不豁免任何错误码 —— D000~D005 全部强制执行
ignore =

# ------------------------------------------------------------------
# 路径豁免
# ------------------------------------------------------------------
# 不豁免任何路径
ignore-path =

# ------------------------------------------------------------------
# 按文件豁免特定错误码
# ------------------------------------------------------------------
# 不为任何文件设置错误豁免
ignore-path-errors =

# ------------------------------------------------------------------
# Sphinx 支持
# ------------------------------------------------------------------
# sphinx = true  → 保留 Sphinx 专属语法（.. code-block::、.. toctree:: 等）
# 的正常解析，避免误报（对应 CLI 的 --no-sphinx 取反）
sphinx = true

# ------------------------------------------------------------------
# 文件编码
# ------------------------------------------------------------------
file-encoding = utf-8

# ------------------------------------------------------------------
# 无扩展名文件的默认扩展名
# ------------------------------------------------------------------
default-extension = .rst

# ------------------------------------------------------------------
# 额外检查的文件扩展名
# ------------------------------------------------------------------
# .rst   — 标准 reStructuredText 文件
# .txt   — 纯文本 / RST 风格文档
extension = .rst
            .txt
