# SELinux Policy Lint 配置 — RK3588-Alientek-AAOS 项目（全量严格模式）
# 工具：selint（https://github.com/SELinuxProject/selint）
# 文档：https://github.com/SELinuxProject/selint/wiki
#       https://source.android.com/docs/security/features/selinux
#
# 用法（CI）：
#   selint \
#     --config .lintrc/embedded/selinux/selint.conf \
#     --source \
#     --recursive \
#     --summary \
#     device/rockchip/rk3588/sepolicy/ \
#     system/sepolicy/
#
#   # 附加：checkpolicy 语法检查
#   checkpolicy -M -c 33 -o /dev/null <policy_file.te>
#
#   # 附加：sepolicy-analyze（Android 专用）
#   sepolicy-analyze <policy_file.te> permissive

[settings]
# 最低报告严重级别：
#   C = Convention（风格约定，最低）
#   W = Warning（警告）
#   E = Error（错误）
#   F = Fatal（致命，解析失败）
# 设为 C 以捕获所有问题（最严格）
severity = "C"

# 详细模式级别（0 = 仅结果，1 = 包含上下文，2 = 调试）
verbose = 1

[checks]
# 启用所有内置检查
# C-001: 声明顺序约定违规
#        （类型声明必须在使用之前，allow 规则在类型声明之后）
# C-002: 风格约定违规
#        （命名、空格、注释格式等）
# W-001: 类型声明后无任何访问规则（无用类型声明）
# W-002: .te 文件中存在 ifdef 结构（不推荐，难以维护）
# W-003: permissive domain（生产策略中禁止）
# W-004: allow 规则使用 self（可能过于宽泛）
# W-005: file_contexts 路径未在起始锚定（^）
# W-006: file_contexts 路径未在末尾锚定（$）
# E-001: 引用了未定义的类型、属性或角色
# E-002: 空块（空的 typeattribute、type 声明等）
# F-001: 无法识别的关键字（解析错误）
# F-002: 括号不匹配（解析错误）

# 启用的检查列表（全部启用，不跳过任何）
enabled = [
    "C-001",
    "C-002",
    "W-001",
    "W-002",
    "W-003",
    "W-004",
    "W-005",
    "W-006",
    "E-001",
    "E-002",
    "F-001",
    "F-002",
]

# 禁用的检查列表 — 空：所有检查全部执行，无任何例外
disabled = []

[naming]
# 类型名：<domain>_t（Android SELinux 强制约定）
# 正确示例：rk3588_hal_t、vendor_audio_hal_t
# 错误示例：rk3588hal、RK3588_HAL
type_pattern = "^[a-z][a-z0-9_]*_t$"

# 属性名：lowercase_with_underscores（无 _t 后缀）
# 正确示例：hal_attribute、vendor_file_attribute
attribute_pattern = "^[a-z][a-z0-9_]+$"

# 域名（domain 是类型的子集，命名规则相同）
domain_pattern = "^[a-z][a-z0-9_]*_t$"

# file_contexts 中的 genfscon / fs_use 上下文标签格式
# 必须是完整的 SELinux 安全上下文：user:role:type[:sensitivity]
context_pattern = "^[a-z_]+:[a-z_]+:[a-z][a-z0-9_]*_t(:[sS][0-9]+((-[sS][0-9]+)?(:[cC][0-9]+(-[cC][0-9]+)?(,[cC][0-9]+(-[cC][0-9]+)*)*)?)?)?$"

[android]
# ------------------------------------------------------------------
# Android SELinux 专项规则
# ------------------------------------------------------------------

# 禁止生产策略中出现 permissive 域
# permissive 仅允许在开发/调试构建中临时使用
forbid_permissive = true

# 禁止 neverallow 规则覆盖（不得用 auditallow 或 dontaudit 绕过 neverallow 精神）
forbid_neverallow_bypass = true

# 警告通配符权限（allow domain type:class *）
# 应明确列出所需权限，不允许使用通配符
warn_wildcard_permissions = true

# 警告对 unlabeled 类型的 allow 访问
# unlabeled 是未打标签文件的默认标签，允许访问意味着策略不完整
warn_access_to_unlabeled = true

# 禁止 allow 规则授予对 kernel 域的访问（内核域权限应由内核自身管理）
forbid_allow_to_kernel_domain = true

# 警告 dontaudit 用于安全敏感的访问类（这些拒绝应被记录，不应被静默）
warn_dontaudit_for_security_classes = [
    "capability",
    "capability2",
    "security",
    "keystore2_key",
    "binder",
    "property_service",
]

# 禁止 auditallow 规则没有对应的 allow 规则（无用规则）
forbid_auditallow_without_allow = true

# vendor 类型必须声明在 vendor/ 分区的策略文件中
# （不得在 system/sepolicy/ 中声明 vendor 类型）
require_vendor_type_in_vendor_policy = true

# 禁止 vendor 域直接访问 system 私有类型
# （应通过 vendor_public_api 属性或 AIDL/HIDL 接口访问）
forbid_vendor_access_to_system_private_types = true

# 禁止从非 shell 域直接 exec shell（防止命令注入逃逸）
forbid_shell_exec_from_non_shell_domains = true

# 禁止 init_daemon_domain() 未使用 typeattribute 声明属性
require_typeattribute_for_init_domains = true

# 所有 HAL server 域必须使用 hal_server_domain() 宏
require_hal_server_domain_macro = true

# 所有 HAL client 域必须使用 hal_client_domain() 宏
require_hal_client_domain_macro = true

# 禁止直接 allow domain block_device:blk_file（应通过特定块设备类型访问）
forbid_broad_block_device_access = true

# 所有新类型必须有 typeattribute 声明（至少归属一个属性）
require_typeattribute = true

# file_contexts 中的路径必须在起始和末尾均有锚定（^ 和 $）
require_file_contexts_anchoring = true

# property_contexts 中的属性必须有显式的读写权限声明
require_property_contexts_permissions = true
