---
# yamllint 配置 — 全量极严格模式（无任何禁用规则）
# 文档：https://yamllint.readthedocs.io/en/stable/rules.html
# 用法：yamllint -c .lintrc/data-formats/.yamllint.yml .

extends: default

rules:
  # ============================================================
  # 行与文档结构
  # ============================================================
  line-length:
    max: 80
    level: error
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false

  document-start:
    present: true
    level: error

  document-end:
    present: false
    level: error

  new-line-at-end-of-file:
    level: error

  new-lines:
    type: unix

  # ============================================================
  # 缩进
  # ============================================================
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: true
    level: error

  # ============================================================
  # 空格
  # ============================================================
  trailing-spaces:
    level: error

  empty-lines:
    max: 1
    max-start: 0
    max-end: 0
    level: error

  empty-values:
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true
    level: error

  # ============================================================
  # 冒号、逗号、连字符
  # ============================================================
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
    level: error

  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
    level: error

  hyphens:
    max-spaces-after: 1
    level: error

  # ============================================================
  # 括号与方括号
  # ============================================================
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
    level: error

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
    level: error

  # ============================================================
  # 注释
  # ============================================================
  comments:
    level: error
    min-spaces-from-content: 2
    require-starting-space: true

  comments-indentation:
    level: error

  # ============================================================
  # 引号与字符串
  # ============================================================
  quoted-strings:
    # 仅在必须引号时才使用引号（避免不必要的引号污染）
    quote-type: double
    required: only-when-needed
    extra-required: []
    extra-allowed: []
    allow-quoted-quotes-without-separator: false
    level: error

  # ============================================================
  # 键
  # ============================================================
  key-duplicates:
    forbid-duplicated-merge-keys: true
    level: error

  key-ordering:
    level: error

  # ============================================================
  # 真值规范化
  # ============================================================
  truthy:
    # 只允许 YAML 1.2 标准布尔值，禁止 yes/no/on/off（YAML 1.1 遗留）
    allowed-values:
      - "true"
      - "false"
    check-keys: true
    level: error

  # ============================================================
  # YAML 1.1 遗留问题
  # ============================================================
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
    level: error

  # ============================================================
  # 浮点数规范化
  # ============================================================
  float-values:
    # 禁止 .inf / -.inf（隐式无穷大，可移植性差）
    forbid-inf: true
    # 禁止 .nan（非数字值，可移植性差）
    forbid-nan: true
    # 禁止科学计数法（1.5e3 等，避免歧义）
    forbid-scientific-notation: true
    level: error

  # ============================================================
  # 锚点与别名
  # ============================================================
  anchors:
    # 禁止引用未声明的锚点
    forbid-undeclared-aliases: true
    # 禁止重复的锚点名称
    forbid-duplicated-anchors: true
    # 禁止声明但从未使用的锚点
    forbid-unused-anchors: true
    level: error
