---
version: v2

# ============================================================
# buf — Protocol Buffers lint & 破坏性变更检测配置
# 文档：https://buf.build/docs/configuration/v2/buf-yaml
# ============================================================

modules:
  - path: .

lint:
  # ALL 规则集 = MINIMAL + BASIC + DEFAULT + 全部可选规则
  # 在 DEFAULT 基础上额外启用：
  #   COMMENT_ENUM_VALUE      枚举各值必须有注释
  #   COMMENT_FIELD           消息内各字段必须有注释
  #   COMMENT_ONEOF           oneof 组必须有注释
  #   PACKAGE_VERSION_SUFFIX  package 名必须以版本后缀结尾（如 v1, v2alpha1）
  #   RPC_NO_CLIENT_STREAMING 禁止客户端流式 RPC
  #   RPC_NO_SERVER_STREAMING 禁止服务端流式 RPC
  #   RPC_REQUEST_RESPONSE_UNIQUE  每个 RPC 使用唯一的 Request/Response 类型
  #   RPC_REQUEST_STANDARD_NAME    Request 类型命名须为 {RpcName}Request
  #   RPC_RESPONSE_STANDARD_NAME   Response 类型命名须为 {RpcName}Response
  use:
    - ALL
  # 不排除任何规则
  except: []
  # 不豁免任何目录
  ignore: []
  ignore_only: {}
  # 禁止通过 buf:lint:ignore 注释绕过规则
  allow_comment_ignores: false

  # 枚举第一个值（零值）的名称后缀
  enum_zero_value_suffix: _UNSPECIFIED
  # Service 名称必须以 Service 后缀结尾
  service_suffix: Service

breaking:
  # WIRE_JSON — 最严格的破坏性变更检测，同时保证二进制 wire 和 JSON 兼容性
  # 检测范围（包含 FILE 规则集全部内容）：
  #   字段被删除或改变类型 / 字段号
  #   消息/枚举/服务被删除
  #   枚举化名改变（JSON 序列化用字符串名称）
  #   枚举值被删除
  #   必选字段变为可选（proto2）
  #   RPC 签名变更（输入 / 输出类型）
  #   消息字段 JSON 名称对应关系变更
  use:
    - WIRE_JSON
  # 不排除任何规则
  except: []
  # 不豁免任何目录
  ignore: []
  ignore_only: {}

  # 比较目标：对比 master 分支的 git 历史版本
  # CI 中调用示例：
  #   buf breaking --config .lintrc/data-formats/protobuf/buf.yaml \
  #               --against '.git#branch=master'
