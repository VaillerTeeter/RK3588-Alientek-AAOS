---
# checkmake 配置 — Android.mk / Makefile Lint（全量严格模式）
# 工具：checkmake（https://github.com/mrtazz/checkmake）
# 文档：https://github.com/mrtazz/checkmake#readme
#       https://android.googlesource.com/platform/build/+/main/envsetup.sh
#
# 用法（CI）：
#   # 安装：
#   go install github.com/mrtazz/checkmake/cmd/checkmake@latest
#
#   # 检查单个文件：
#   checkmake --config .lintrc/infrastructure/build-systems/.checkmake.ini <Makefile>
#
#   # 批量检查（排除第三方上游目录）：
#   find . -name '*.mk' -o -name 'Makefile' -o -name 'Kbuild' \
#     | grep -v 'Android-13/rk-kernel-5.10/' \
#     | grep -v 'Android-13/u-boot/' \
#     | grep -v 'Android-13/rkbin/' \
#     | grep -v 'Android-13/prebuilts/' \
#     | xargs -n1 checkmake \
#         --config .lintrc/infrastructure/build-systems/.checkmake.ini

[format]
# 输出格式：json（便于 CI 解析），可选 text
enabled = true

[rules]
# ============================================================
# 全部规则说明（checkmake v0.2.4）
# ============================================================

# MAXBODYLENGTH — 规则 body 行数上限
# 单个 recipe 超过此行数意味着应该提取为独立 shell 脚本
maxbodylength = 5

# MINPHONY — 必须声明 .PHONY 的 target 最少数量
# 强制至少有 all / clean 两个 phony target
minphony = 2

# PHONYDECLARED — 所有不产生文件的 target 必须声明为 .PHONY
# 防止同名文件导致 target 被跳过
phonydeclared = true

# MAXVARLENGTH — 变量名最大字符数
maxvarlength = 32

# TIMESTAMPEXPANDED — 禁止在变量展开时使用 $(shell date) 等产生时间戳
# 时间戳会破坏构建的可重现性
timestampexpanded = false

# UNDECLAREDVARIABLE — 警告使用未声明的变量（可能为拼写错误）
undeclaredvariable = false

[linelength]
# 最大行宽（与项目其他配置保持一致）
enabled = true
max_length = 120
